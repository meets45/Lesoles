name: Deploy Development Shopify Theme

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: shopify-theme-development
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Install Yarn
        run: npm install --global yarn@1.22.22

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build theme assets
        run: yarn build

      - name: Verify generated theme assets
        run: |
          test -f shopify/snippets/vite-tag.liquid
          find shopify/assets -maxdepth 1 -name '*.css' -print -quit | grep -q .

      - name: Check Shopify theme
        run: yarn run shopify theme check --config=.theme-check.yml --path=shopify

      - name: Deploy to Shopify
        env:
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_THEME_ID: ${{ secrets.SHOPIFY_DEV_THEME_ID }}
          SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}
        run: >
          yarn run shopify theme push
          --store "$SHOPIFY_STORE"
          --theme "$SHOPIFY_THEME_ID"
          --password "$SHOPIFY_CLI_THEME_TOKEN"
          --nodelete
          --ignore "templates/*.json"
          --ignore "sections/*.json"
          --ignore "locales/*.json"
          --ignore "config/settings_data.json"
          --path=shopify
